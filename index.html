<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Strategy Lab (POC)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; background: #f8fafc; color: #0f172a; }
        h1 { margin: 0 0 4px 0; font-size: 24px; }
        .sub { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
        label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        select, input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { padding: 9px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-add { background: #0284c7; color: #fff; }
        .btn-add:hover { background: #0369a1; }
        .btn-clear { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    </style>
</head>
<body>
    <h1>S&P 500 Strategy Lab (10-Year Backtest POC)</h1>
    <div class="sub">2013-09-29 to 2023-09-29 | Python-powered simulation engine</div>

    <div class="panel">
        <div class="controls">
            <div>
                <label>Invest Frequency</label>
                <select id="cadence" onchange="autoPopulateAmount()">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <div>
                <label>Weekly Day</label>
                <select id="weekday">
                    <option value="0">Monday</option>
                    <option value="1">Tuesday</option>
                    <option value="2">Wednesday</option>
                    <option value="3">Thursday</option>
                    <option value="4">Friday</option>
                </select>
            </div>
            <div>
                <label>Trailing Stop-Loss (X% from Max)</label>
                <input type="number" id="trailing_stop_pct" value="0" min="0" max="95" step="5" title="0 = Never Sell; >0 = sell when lot drops X% from post-buy max price" />
            </div>
            <div>
                <label>Selection Rule</label>
                <select id="direction">
                    <option value="top">Top Gainers (Momentum)</option>
                    <option value="bottom">Top Losers (Dip-Buying)</option>
                    <option value="benchmark">S&P 500 Equal-Weight Benchmark</option>
                </select>
            </div>
            <div>
                <label>Basket Size (Top N)</label>
                <select id="top_n">
                    <option value="1">Top 1 ($100)</option>
                    <option value="5">Top 5 ($20 each)</option>
                    <option value="10">Top 10 ($10 each)</option>
                </select>
            </div>
            <div>
                <label>Ranking Lookback</label>
                <select id="lookback" onchange="autoPopulateAmount()">
                    <option value="1">1 Trading Day</option>
                    <option value="5">5 Trading Days (1 Wk)</option>
                    <option value="20">20 Trading Days (1 Mo)</option>
                </select>
            </div>
            <div>
                <label>Amount ($)</label>
                <input type="number" id="amount" value="100" min="10" step="10">
            </div>
            <div>
                <label>Start Date</label>
                <input type="date" id="startDate">
            </div>
            <div>
                <label>End Date</label>
                <input type="date" id="endDate">
            </div>
            <div>
                <label>Selection Model</label>
                <select id="selectionModel">
                    <option value="all" selected>All S&amp;P 500</option>
                    <option value="low_vol_50">Calmest 50% (12m Low-Vol)</option>
                    <option value="low_vol_20">Calmest 20% (~100 Stocks, 12m)</option>
                </select>
            </div>
            <div>
                <button class="btn-add" onclick="addStrategy()">+ Plot Strategy</button>
            </div>
            <div>
                <button class="btn-clear" onclick="clearAll()">Clear All</button>
            </div>
            <div>
                <button class="btn-clear" onclick="downloadPlot()">Download Plot (PNG)</button>
            </div>
            <div>
                <button class="btn-clear" onclick="downloadCSV()">Download Summary (CSV)</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <canvas id="growthChart" height="100"></canvas>
    </div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3 style="margin:0;">Strategy Comparison</h3>
            <div style="display:flex; gap:8px;">
                <button onclick="downloadTradeCSV('/api/export/transactions', 'transactions.csv')" style="background:#1f6feb; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px;">Download Transactions CSV</button>
                <button onclick="downloadTradeCSV('/api/export/lots', 'lots_performance.csv')" style="background:#238636; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px;">Download Lots Performance CSV</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Strategy</th>
                    <th>Total Invested</th>
                    <th>Final Value</th>
                    <th>Spare Cash (3% YoY)</th>
                    <th>Lots Sold</th>
                    <th>Net Profit</th>
                    <th>ROI %</th>
                    <th>CAGR %</th>
                    <th>Max Drawdown</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
    </div>

    <script>
        const COLORS = ['#0284c7', '#e11d48', '#16a34a', '#9333ea', '#ea580c', '#0f172a'];
        let chart = null;
        let datasets = [];
        let rows = [];
        let commonDates = [];

        async function runSim(cfg, label, color, isDashed=false) {
            const res = await fetch('/api/simulate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(cfg)
            });
            const data = await res.json();
            if (commonDates.length === 0) {
                commonDates = data.dates;
                datasets.push({
                    label: 'Cash Contributed ($)',
                    data: data.contributed,
                    borderColor: '#94a3b8',
                    borderDash: [5, 5],
                    pointRadius: 0,
                    borderWidth: 2
                });
            }
            datasets.push({
                label: label,
                data: data.equity,
                borderColor: color,
                borderDash: isDashed ? [3,3] : [],
                pointRadius: 0,
                borderWidth: 2.5,
                tension: 0.1
            });
            rows.push({ label, color, cfg, m: data.metrics });
            render();
        }

        function autoPopulateAmount() {
            const cadence = document.getElementById('cadence').value;
            const amountEl = document.getElementById('amount');
            if (cadence === 'daily') amountEl.value = 100;
            else if (cadence === 'weekly') amountEl.value = 482;
            else if (cadence === 'monthly') amountEl.value = 2094;
        }

        function addStrategy() {
            const cfg = {
                cadence: document.getElementById('cadence').value,
                direction: document.getElementById('direction').value,
                top_n: parseInt(document.getElementById('top_n').value),
                lookback: parseInt(document.getElementById('lookback').value),
                amount: parseFloat(document.getElementById('amount').value) || 100,
                weekday: parseInt(document.getElementById('weekday').value) || 0,
                trailing_stop_pct: parseFloat(document.getElementById('trailing_stop_pct').value) || 0,
                start_date: document.getElementById('startDate').value || null,
                end_date: document.getElementById('endDate').value || null,
                selection_model: document.getElementById('selectionModel').value
            };
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            const dayTag = cfg.cadence === 'weekly' ? ` (${dayNames[cfg.weekday]})` : '';
            const slTag = cfg.trailing_stop_pct > 0 ? ` | TSL -${cfg.trailing_stop_pct}%` : '';
            const selTag = cfg.selection_model === 'low_vol_50' ? ' | Calm 50%' : (cfg.selection_model === 'low_vol_20' ? ' | Calm 20%' : '');
            const dirLabel = cfg.direction === 'benchmark' ? 'S&P 500 Benchmark' : `${cfg.direction === 'top' ? 'Top' : 'Bottom'} ${cfg.top_n} (${cfg.lookback}d)`;
            const label = `${cfg.cadence.toUpperCase()}${dayTag} $${cfg.amount} | ${dirLabel}${selTag}${slTag}`;
            const color = COLORS[rows.length % COLORS.length];
            runSim(cfg, label, color);
        }

        function clearAll() {
            datasets = [];
            rows = [];
            commonDates = [];
            render();
        }

        function downloadPlot() {
            const canvas = document.getElementById('growthChart');
            const link = document.createElement('a');
            link.download = 'sp500_strategy_plot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadCSV() {
            const header = ['Strategy', 'Total Invested', 'Final Value', 'Spare Cash (3% YoY)', 'Lots Sold', 'Net Profit', 'ROI %', 'CAGR %', 'Max Drawdown %'];
            const csvRows = [header.join(',')];
            rows.forEach(r => {
                const m = r.m;
                csvRows.push([
                    `"${r.label}"`,
                    m.total_contributed,
                    m.final_value,
                    m.spare_cash ?? 0,
                    m.lots_sold ?? 0,
                    m.profit,
                    m.roi_pct,
                    m.cagr_pct,
                    m.max_drawdown_pct
                ].join(','));
            });
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const link = document.createElement('a');
            link.download = 'sp500_strategy_summary.csv';
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        function render() {
            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('growthChart').getContext('2d'), {
                type: 'line',
                data: { labels: commonDates, datasets: datasets },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: { y: { ticks: { callback: v => '$' + v.toLocaleString() } } }
                }
            });

            const tbody = document.getElementById('summary-body');
            tbody.innerHTML = rows.map(r => `
                <tr>
                    <td><span class="dot" style="background:${r.color}"></span><strong>${r.label}</strong></td>
                    <td>$${r.m.total_contributed.toLocaleString()}</td>
                    <td><strong>$${r.m.final_value.toLocaleString()}</strong></td>
                    <td style="color:#0284c7"><strong>$${(r.m.spare_cash ?? 0).toLocaleString()}</strong></td>
                    <td>${(r.m.lots_sold ?? 0).toLocaleString()}</td>
                    <td style="color:${r.m.profit >= 0 ? '#16a34a' : '#e11d48'}">$${r.m.profit.toLocaleString()}</td>
                    <td>${r.m.roi_pct}%</td>
                    <td>${r.m.cagr_pct}%</td>
                    <td style="color:#e11d48">${r.m.max_drawdown_pct}%</td>
                </tr>
            `).join('');
        }

        async function downloadTradeCSV(endpoint, filename) {
            if (!rows || rows.length === 0) {
                alert('Run at least one strategy first.');
                return;
            }
            const payload = rows.map(r => ({ name: r.label, config: r.cfg || {} }));
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                alert('Failed to generate CSV.');
                return;
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load initial comparison on startup: Weekly Top 5 Gainers vs Bottom 5 Losers
        window.onload = async () => {
            await runSim({cadence:'weekly', weekday:0, direction:'top', top_n:5, lookback:5, amount:500}, 'WEEKLY $500 | Top 5 Gainers (Mon)', COLORS[0]);
            await runSim({cadence:'weekly', weekday:0, direction:'bottom', top_n:5, lookback:5, amount:500}, 'WEEKLY $500 | Bottom 5 Losers (Mon)', COLORS[1]);
        };
    </script>
</body>
</html>
